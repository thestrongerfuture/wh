<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إدارة المنتجات | شركة المستقبل الأقوى</title>
  <link rel="icon" type="image/png" href="/images/logo.png">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .admin-page { padding: 30px 0 60px; }
    .login-box { max-width: 400px; margin: 80px auto; background: var(--card-bg); padding: 30px; border-radius: var(--radius); box-shadow: var(--shadow); text-align: center; }
    .login-box h2 { color: var(--primary); margin-bottom: 20px; }
    .login-box input { width: 100%; padding: 12px; border: 2px solid var(--border); border-radius: var(--radius-sm); font-size: 1rem; margin-bottom: 12px; font-family: inherit; text-align: center; }
    .login-box button { width: 100%; padding: 12px; background: var(--primary); color: #fff; border-radius: var(--radius-sm); font-weight: 700; font-size: 1rem; }

    .product-admin-card { display: flex; align-items: center; gap: 12px; padding: 12px; margin-bottom: 10px; background: var(--card-bg); border-radius: var(--radius-sm); box-shadow: 0 1px 4px rgba(0,0,0,0.05); border: 1px solid var(--border); }
    .product-admin-img { width: 50px; height: 50px; object-fit: cover; border-radius: 8px; background: #f3f4f6; }
    .product-admin-info { flex: 1; }
    .product-admin-name { font-weight: 700; font-size: 0.95rem; color: var(--text); }
    .product-admin-meta { font-size: 0.8rem; color: var(--text-muted); display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
    
    .btn-edit { background: #eff6ff; color: var(--primary); padding: 8px 12px; border-radius: var(--radius-sm); font-weight: 700; font-size: 0.8rem; border: none; cursor: pointer; transition: 0.2s; }
    .btn-edit:hover { background: #dbeafe; }
    .btn-toggle { padding: 8px 12px; border-radius: var(--radius-sm); font-weight: 700; font-size: 0.8rem; cursor: pointer; border: none; transition: 0.2s; }
    .btn-delete { background: #fee2e2; color: #dc2626; padding: 8px 12px; border-radius: var(--radius-sm); font-weight: 700; font-size: 0.8rem; border: none; cursor: pointer; transition: 0.2s; }
    .btn-delete:hover { background: #fca5a5; }

    .search-bar-admin { width: 100%; padding: 12px 20px; border: 2px solid var(--border); border-radius: var(--radius-sm); font-size: 1rem; font-family: inherit; margin-bottom: 16px; }
    #productsAdminList { max-height: 70vh; overflow-y: auto; padding: 4px; }

    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 300; padding: 16px; }
    .modal-overlay.hidden { display: none; }
    .modal-content { background: #fff; border-radius: 16px; position: relative; width: 100%; max-height: 90vh; overflow-y: auto; }

    @media (max-width: 768px) {
      .product-admin-card { flex-wrap: wrap; }
      .product-admin-info { min-width: 100%; }
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="container header-inner">
      <a href="/admin.html" class="icon-btn" style="background:#fff; color:#0040C0; border:none; box-shadow:0 2px 5px rgba(0,0,0,0.1); font-weight:700;">
        <img src="/images/logo.png" alt="شعار" class="brand-logo">
        <div class="brand-text">
          <span class="ar">شركة المستقبل الأقوى</span>
          <span class="en">متجر الجملة - إدارة المنتجات</span>
        </div>
      </a>
      <div class="header-actions">
        <a href="/admin.html" class="icon-btn" style="background:#fff; color:#0040C0; border:none; box-shadow:0 2px 5px rgba(0,0,0,0.1); font-weight:700;">🏠 <span>الرئيسية</span></a>
        <button class="icon-btn" id="logoutBtn" style="display:none; background: #fef2f2; color: #dc2626; font-weight: 700; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">🚪 <span>خروج</span></button>
      </div>
    </div>
  </header>

  <div id="loginView" class="login-box">
    <h2>🔒 الدخول للوحة الإدارة</h2>
    <input type="password" id="passwordInput" placeholder="أدخل كلمة المرور" autofocus>
    <button id="loginBtn">دخول</button>
    <p id="loginError" style="color: var(--danger); margin-top: 10px; font-size: 0.9rem; display: none;"></p>
  </div>

  <main id="adminView" class="container admin-page" style="display: none;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px;">
      <h2 style="color: var(--primary); font-size: 1.4rem;">📦 إدارة المنتجات</h2>
      <div style="display: flex; gap: 8px; flex-wrap: wrap;">
        <button id="addNewProductBtn" class="btn-primary" style="padding: 8px 16px; font-size: 0.9rem; background: #10b981;">➕ إضافة منتج جديد</button>
        <button id="exportProductsBtn" class="btn-primary" style="padding: 8px 16px; font-size: 0.9rem; background: var(--primary);">📤 تصدير منتجات المتجر إلى ملف CSV</button>
        <button id="downloadSampleBtn" class="btn-primary" style="padding: 8px 16px; font-size: 0.9rem; background: var(--primary);">📥 تنزيل نموذج CSV</button>
        <input type="file" id="csvFileInput" accept=".csv" style="display: none;">
        <button id="uploadCsvBtn" class="btn-primary" style="padding: 8px 16px; font-size: 0.9rem;">📤 رفع الأصناف من ملف CSV</button>
      </div>
    </div>

    <input type="text" id="searchAdmin" class="search-bar-admin" placeholder="🔍 بحث بالاسم أو الرقم...">
    <div id="loading" class="loading">⏳ جاري التحميل...</div>
    <div id="emptyState" class="empty-state hidden"><div class="emoji">📭</div><p>لا توجد منتجات</p></div>
    <div id="productsAdminList"></div>
  </main>

  <!-- MODAL: ADD NEW PRODUCT -->
  <div class="modal-overlay hidden" id="addProductModal">
    <div class="modal-content" style="max-width: 500px; padding: 24px; text-align: right;">
      <button class="modal-close" id="closeAddModal" style="position: absolute; top: 10px; left: 10px; font-size: 1.5rem; color: #999; background: none; border: none; cursor: pointer;">✕</button>
      <h3 style="margin-bottom: 20px; color: var(--primary);">➕ إضافة منتج جديد</h3>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px;">
        <div><label style="font-weight: 700; font-size: 0.9rem; display: block; margin-bottom: 4px;">رمز المنتج (ID) *</label><input type="number" id="addProductId" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-family: inherit;" placeholder="مثال: 5001"></div>
        <div><label style="font-weight: 700; font-size: 0.9rem; display: block; margin-bottom: 4px;">الماركة</label><input type="text" id="addProductBrand" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-family: inherit;"></div>
      </div>
      <div style="margin-bottom: 12px;"><label style="font-weight: 700; font-size: 0.9rem; display: block; margin-bottom: 4px;">اسم المنتج *</label><input type="text" id="addProductName" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-family: inherit;"></div>
      <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 12px;">
        <div><label style="font-weight: 700; font-size: 0.9rem; display: block; margin-bottom: 4px;">القسم</label><input type="text" id="addProductCategory" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-family: inherit;"></div>
        <div><label style="font-weight: 700; font-size: 0.9rem; display: block; margin-bottom: 4px;">السعر *</label><input type="number" id="addProductPrice" step="0.01" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-family: inherit;"></div>
        <div><label style="font-weight: 700; font-size: 0.9rem; display: block; margin-bottom: 4px;">الكمية *</label><input type="number" id="addProductStock" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-family: inherit;"></div>
      </div>
      <div style="margin-bottom: 20px;"><label style="font-weight: 700; font-size: 0.9rem; display: block; margin-bottom: 4px;">الوصف</label><textarea id="addProductDescription" rows="3" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-family: inherit;"></textarea></div>
      <div style="display: flex; gap: 10px;">
        <button id="cancelAddProduct" style="flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #ccc; background: #fff; font-weight: 700; color: #555; cursor: pointer;">إلغاء</button>
        <button id="saveNewProduct" style="flex: 2; padding: 12px; border-radius: 8px; border: none; background: #10b981; color: #fff; font-weight: 700; cursor: pointer;">حفظ المنتج</button>
      </div>
    </div>
  </div>

  <!-- MODAL: EDIT PRODUCT -->
  <div class="modal-overlay hidden" id="editProductModal">
    <div class="modal-content" style="max-width: 500px; padding: 24px; text-align: right;">
      <button class="modal-close" id="closeEditModal" style="position: absolute; top: 10px; left: 10px; font-size: 1.5rem; color: #999; background: none; border: none; cursor: pointer;">✕</button>
      <h3 style="margin-bottom: 20px; color: var(--primary);">✏️ تعديل المنتج</h3>
      <input type="hidden" id="editProductIdHidden">
      
      <div style="margin-bottom: 12px;"><label style="font-weight: 700; font-size: 0.9rem; display: block; margin-bottom: 4px;">اسم المنتج</label><input type="text" id="editProductName" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-family: inherit;"></div>
      
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px;">
        <div><label style="font-weight: 700; font-size: 0.9rem; display: block; margin-bottom: 4px;">السعر</label><input type="number" id="editProductPrice" step="0.01" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-family: inherit;"></div>
        <div><label style="font-weight: 700; font-size: 0.9rem; display: block; margin-bottom: 4px;">الكمية (المخزون)</label><input type="number" id="editProductStock" min="0" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-family: inherit;"></div>
      </div>

      <div style="margin-bottom: 12px;"><label style="font-weight: 700; font-size: 0.9rem; display: block; margin-bottom: 4px;">الوصف</label><textarea id="editProductDescription" rows="3" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-family: inherit;"></textarea></div>

      <div style="margin-bottom: 20px;"><label style="font-weight: 700; font-size: 0.9rem; display: block; margin-bottom: 4px;">تاريخ الإضافة (لتحديد ظهوره في "جديدنا")</label><input type="date" id="editProductDate" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-family: inherit;"></div>
      
      <div style="display: flex; gap: 10px;">
        <button id="cancelEditProduct" style="flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #ccc; background: #fff; font-weight: 700; color: #555; cursor: pointer;">إلغاء</button>
        <button id="saveEditProduct" style="flex: 2; padding: 12px; border-radius: 8px; border: none; background: var(--primary); color: #fff; font-weight: 700; cursor: pointer;">حفظ التعديلات</button>
      </div>
    </div>
  </div>

  <script>
    let adminPassword = sessionStorage.getItem('admin_pass') || '';
    let allProducts = [];
    
    const $ = (s) => document.querySelector(s);
    const loginView = $('#loginView');
    const adminView = $('#adminView');
    const listEl = $('#productsAdminList');
    const loading = $('#loading');
    const emptyState = $('#emptyState');
    const logoutBtn = $('#logoutBtn');

    $('#loginBtn').onclick = tryLogin;
    $('#passwordInput').onkeypress = (e) => { if (e.key === 'Enter') tryLogin(); };
    logoutBtn.onclick = () => { sessionStorage.removeItem('admin_pass'); location.reload(); };

    async function tryLogin() {
      const pass = $('#passwordInput').value;
      if (!pass) return;
      const errEl = $('#loginError');
      errEl.style.display = 'none';
      try {
        const res = await fetch('/api/admin-products-list', { headers: { 'X-Admin-Password': pass } });
        if (res.status === 401) { errEl.textContent = 'كلمة المرور غير صحيحة'; errEl.style.display = 'block'; return; }
        adminPassword = pass;
        sessionStorage.setItem('admin_pass', pass);
        showAdmin();
      } catch (e) { errEl.textContent = 'خطأ في الاتصال'; errEl.style.display = 'block'; }
    }

    function showAdmin() {
      loginView.style.display = 'none';
      adminView.style.display = 'block';
      logoutBtn.style.display = 'inline-flex';
      loadProducts();
    }

    async function loadProducts() {
      loading.style.display = 'block';
      emptyState.classList.add('hidden');
      listEl.innerHTML = '';
      try {
        const res = await fetch('/api/admin-products-list', { headers: { 'X-Admin-Password': adminPassword } });
        const data = await res.json();
        if (!data.ok) throw new Error(data.error);
        allProducts = data.products;
        loading.style.display = 'none';
        renderList(allProducts);
      } catch (e) {
        loading.style.display = 'none';
        listEl.innerHTML = `<p style="color:var(--danger); text-align:center;">❌ ${e.message}</p>`;
      }
    }

    function renderList(products) {
      if (products.length === 0) { emptyState.classList.remove('hidden'); return; }
      emptyState.classList.add('hidden');
      listEl.innerHTML = '';

      products.forEach(p => {
        const card = document.createElement('div');
        card.className = 'product-admin-card';
        const isHidden = p.is_hidden === 1;
        const imgSrc = `/images/products/${p.id}.webp`;

        card.innerHTML = `
          <img src="${imgSrc}" class="product-admin-img" alt="${p.name}" onerror="this.src='/images/logo.png'">
          <div class="product-admin-info">
            <div class="product-admin-name">${p.name}</div>
            <div class="product-admin-meta">
              <span>#${p.id}</span>
              <span>${p.brand || 'بدون ماركة'}</span>
              <span>${p.category || 'بدون قسم'}</span>
              <span style="font-weight:700; color:var(--primary);">$${p.price}</span>
              <span style="color:${p.stock > 0 ? 'var(--success)' : 'var(--danger)'};">المخزون: ${p.stock}</span>
            </div>
          </div>
          <div style="display: flex; gap: 6px; flex-shrink: 0;">
            <button class="btn-edit" data-id="${p.id}">✏️ تعديل</button>
            <button class="btn-toggle" data-id="${p.id}" style="background: ${isHidden ? '#d1fae5' : '#fef3c7'}; color: ${isHidden ? '#065f46' : '#92400e'};">
              ${isHidden ? '👁️ إظهار' : '🙈 إخفاء'}
            </button>
            <button class="btn-delete" data-id="${p.id}">🗑️ حذف</button>
          </div>
        `;

        card.querySelector('.btn-edit').onclick = () => openEditModal(p);
        card.querySelector('.btn-toggle').onclick = () => toggleProduct(p);
        card.querySelector('.btn-delete').onclick = () => deleteProduct(p);
        listEl.appendChild(card);
      });
    }

    $('#searchAdmin').addEventListener('input', (e) => {
      const q = e.target.value.trim().toLowerCase();
      const filtered = allProducts.filter(p => p.name.toLowerCase().includes(q) || p.id.toString().includes(q));
      renderList(filtered);
    });

    async function toggleProduct(p) {
      try {
        const res = await fetch('/api/toggle-product', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-Admin-Password': adminPassword },
          body: JSON.stringify({ id: p.id })
        });
        const data = await res.json();
        if (!data.ok) throw new Error(data.error);
        loadProducts();
      } catch (e) { alert('❌ ' + e.message); }
    }

    async function deleteProduct(p) {
      if (!confirm(`هل أنت متأكد من حذف المنتج "${p.name}" نهائياً؟`)) return;
      try {
        const res = await fetch('/api/delete-product', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-Admin-Password': adminPassword },
          body: JSON.stringify({ id: p.id })
        });
        const data = await res.json();
        if (!data.ok) throw new Error(data.error);
        alert('✅ تم حذف المنتج بنجاح');
        loadProducts();
      } catch (e) { alert('❌ ' + e.message); }
    }

    const addModal = $('#addProductModal');
    $('#addNewProductBtn').onclick = () => {
      $('#addProductId').value = '';
      $('#addProductName').value = '';
      $('#addProductBrand').value = '';
      $('#addProductCategory').value = '';
      $('#addProductPrice').value = '';
      $('#addProductStock').value = '';
      $('#addProductDescription').value = '';
      addModal.classList.remove('hidden');
    };

    $('#closeAddModal').onclick = () => addModal.classList.add('hidden');
    $('#cancelAddProduct').onclick = () => addModal.classList.add('hidden');
    
    $('#saveNewProduct').onclick = async () => {
      const id = $('#addProductId').value;
      const name = $('#addProductName').value;
      const price = $('#addProductPrice').value;
      const stock = $('#addProductStock').value;
      if (!id || !name || !price || !stock) { alert('❌ يرجى ملء الحقول الإلزامية (الرمز، الاسم، السعر، الكمية)'); return; }

      const payload = {
        id: parseInt(id),
        name: name,
        brand: $('#addProductBrand').value,
        category: $('#addProductCategory').value,
        price: parseFloat(price),
        stock: parseInt(stock),
        description: $('#addProductDescription').value
      };

      try {
        $('#saveNewProduct').textContent = '⏳ جاري الحفظ...';
        $('#saveNewProduct').disabled = true;
        const res = await fetch('/api/add-product', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-Admin-Password': adminPassword },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (!data.ok) throw new Error(data.error);
        alert('✅ تم إضافة المنتج بنجاح');
        addModal.classList.add('hidden');
        loadProducts();
      } catch (e) { alert('❌ ' + e.message); }
      finally { $('#saveNewProduct').textContent = 'حفظ المنتج'; $('#saveNewProduct').disabled = false; }
    };

    const editModal = $('#editProductModal');
    
    function openEditModal(p) {
      $('#editProductIdHidden').value = p.id;
      $('#editProductName').value = p.name;
      $('#editProductPrice').value = p.price;
      $('#editProductStock').value = p.stock;
      $('#editProductDescription').value = p.description || '';
      
      if (p.created_at) {
        const d = new Date(p.created_at.includes('Z') ? p.created_at : p.created_at + 'Z');
        if (!isNaN(d.getTime())) {
          $('#editProductDate').value = d.toLocaleDateString('en-CA', { timeZone: 'Asia/Damascus' });
        }
      } else {
        $('#editProductDate').value = '';
      }
      editModal.classList.remove('hidden');
    }

    $('#closeEditModal').onclick = () => editModal.classList.add('hidden');
    $('#cancelEditProduct').onclick = () => editModal.classList.add('hidden');

    $('#saveEditProduct').onclick = async () => {
      const id = $('#editProductIdHidden').value;
      const name = $('#editProductName').value;
      const price = $('#editProductPrice').value;
      const stock = $('#editProductStock').value;
      const description = $('#editProductDescription').value;
      const date = $('#editProductDate').value;

      try {
        const res = await fetch('/api/edit-product', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-Admin-Password': adminPassword },
          body: JSON.stringify({ id, name, price, stock, description, created_at: date || null })
        });
        const data = await res.json();
        if (!data.ok) throw new Error(data.error);
        alert('✅ تم حفظ التعديلات');
        editModal.classList.add('hidden');
        loadProducts();
      } catch (e) { alert('❌ ' + e.message); }
    };

    $('#exportProductsBtn').onclick = () => {
      if (allProducts.length === 0) { alert('❌ لا توجد منتجات لتصديرها'); return; }
      const headers = ['id', 'name', 'brand', 'category', 'stock', 'price', 'description'];
      const csvRows = [headers.join(',')];
      allProducts.forEach(p => {
        const row = [
          p.id,
          `"${(p.name || '').replace(/"/g, '""')}"`,
          `"${(p.brand || '').replace(/"/g, '""')}"`,
          `"${(p.category || '').replace(/"/g, '""')}"`,
          p.stock,
          p.price,
          `"${(p.description || '').replace(/"/g, '""')}"`
        ];
        csvRows.push(row.join(','));
      });
      const csvContent = csvRows.join('\n');
      const blob = new Blob(["\ufeff" + csvContent], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `products_export_${new Date().toISOString().split('T')[0]}.csv`;
      link.click();
      URL.revokeObjectURL(link.href);
    };

    const csvFileInput = $('#csvFileInput');
    const uploadCsvBtn = $('#uploadCsvBtn');
    uploadCsvBtn.onclick = () => csvFileInput.click();
    csvFileInput.onchange = async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      if (!file.name.toLowerCase().endsWith('.csv')) { alert('❌ الملف يجب أن يكون بصيغة CSV'); return; }
      const formData = new FormData();
      formData.append('file', file);
      uploadCsvBtn.disabled = true;
      uploadCsvBtn.textContent = '⏳ جاري الرفع...';
      try {
        const res = await fetch('/api/update-stock', { method: 'POST', headers: { 'X-Admin-Password': adminPassword }, body: formData });
        const data = await res.json();
        if (!data.ok) throw new Error(data.error);
        alert(`✅ تم التحديث!\n📦 الإجمالي: ${data.total}\n➕ مضاف: ${data.added}\n🔄 محدث: ${data.updated}`);
        loadProducts();
      } catch (err) { alert('❌ خطأ: ' + err.message); }
      finally { uploadCsvBtn.disabled = false; uploadCsvBtn.textContent = '📤 رفع الأصناف من ملف CSV'; csvFileInput.value = ''; }
    };

    $('#downloadSampleBtn').onclick = () => {
      const csvContent = "id,name,brand,category,stock,price,description\n" +
                         "1001,منتج تجريبي 1,ماركة أ,قسم أ,10,150,هذا وصف تجريبي للمنتج الأول\n" +
                         "1002,منتج تجريبي 2,ماركة ب,قسم ب,20,250.50,هذا وصف تجريبي للمنتج الثاني\n" +
                         "1003,منتج تجريبي 3,ماركة ج,قسم ج,5,99.99,هذا وصف تجريبي للمنتج الثالث\n";
      const blob = new Blob(["\ufeff" + csvContent], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = 'sample_products.csv';
      link.click();
      URL.revokeObjectURL(link.href);
    };

    if (adminPassword) showAdmin();
  </script>
