﻿<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة الإدارة | شركة المستقبل الأقوى</title>
  <link rel="icon" type="image/png" href="/images/logo.png">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .admin-page { padding: 30px 0 60px; }
    .login-box { max-width: 400px; margin: 80px auto; background: var(--card-bg); padding: 30px; border-radius: var(--radius); box-shadow: var(--shadow); text-align: center; }
    .login-box h2 { color: var(--primary); margin-bottom: 20px; }
    .login-box input { width: 100%; padding: 12px; border: 2px solid var(--border); border-radius: var(--radius-sm); font-size: 1rem; margin-bottom: 12px; font-family: inherit; text-align: center; }
    .login-box button { width: 100%; padding: 12px; background: var(--primary); color: #fff; border-radius: var(--radius-sm); font-weight: 700; font-size: 1rem; }

    .order-card { background: var(--card-bg); border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 16px; overflow: hidden; }
    .order-header { background: #f8fafc; padding: 16px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px; border-bottom: 1px solid var(--border); }
    .order-info { display: flex; flex-direction: column; gap: 4px; font-size: 0.9rem; }
    .order-info strong { color: var(--primary); font-size: 1rem; }
    
    .order-body { padding: 16px; }
    
    .order-item-row {
      display: grid;
      grid-template-columns: 1fr 100px 100px 100px 40px;
      gap: 10px;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.9rem;
    }
    .order-item-row:last-child { border-bottom: none; }
    
    .btn-delete-item {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fee2e2;
      color: #dc2626;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      justify-self: center;
      transition: 0.2s;
    }
    .btn-delete-item:hover { background: #fca5a5; }

    .order-item-row input { width: 70px; padding: 6px; border: 1px solid var(--border); border-radius: var(--radius-sm); text-align: center; }
    .order-actions { padding: 16px; background: #f8fafc; display: flex; gap: 10px; flex-wrap: wrap; }
    .btn-approve { background: var(--success); color: #fff; padding: 10px 20px; border-radius: var(--radius-sm); font-weight: 700; }
    .btn-approve:hover { background: #059669; }
    .btn-reject { background: var(--danger); color: #fff; padding: 10px 20px; border-radius: var(--radius-sm); font-weight: 700; }
    .btn-reject:hover { background: #dc2626; }
    
    .status-badge { padding: 4px 12px; border-radius: 999px; font-size: 0.8rem; font-weight: 700; }
    .status-pending { background: #fef3c7; color: #92400e; }
    .status-approved { background: #d1fae5; color: #065f46; }
    .status-rejected { background: #fee2e2; color: #991b1b; }

    .tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
    .tab-btn { padding: 8px 16px; border-radius: var(--radius-sm); background: #fff; border: 2px solid var(--border); font-weight: 700; font-size: 0.9rem; }
    .tab-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="container header-inner">
      <a href="/" class="icon-btn" style="background:#fff; color:#0040C0; border:none; box-shadow:0 2px 5px rgba(0,0,0,0.1); font-weight:700;">
        <img src="/images/logo.png" alt="شعار" class="brand-logo">
        <div class="brand-text">
          <span class="ar">شركة المستقبل الأقوى</span>
          <span class="en">متجر الجملة - لوحة الإدارة</span>
        </div>
      </a>
      <div class="header-actions">
        <a href="/" class="icon-btn" style="background:#fff; color:#0040C0; border:none; box-shadow:0 2px 5px rgba(0,0,0,0.1); font-weight:700;">🏠 <span>الرئيسية</span></a>
        <button class="icon-btn" id="logoutBtn" style="display:none; background: #fef2f2; color: #dc2626; font-weight: 700; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">🚪 <span>خروج</span></button>
      </div>
    </div>
  </header>

  <div id="loginView" class="login-box">
    <h2>🔒 الدخول للوحة الإدارة</h2>
    <input type="password" id="passwordInput" placeholder="أدخل كلمة المرور" autofocus>
    <button id="loginBtn">دخول</button>
    <p id="loginError" style="color: var(--danger); margin-top: 10px; font-size: 0.9rem; display: none;"></p>
  </div>

  <main id="adminView" class="container admin-page" style="display: none;">
    <div class="tabs" style="align-items: center;">
      <a href="/admin-products.html" class="btn-primary" style="text-decoration: none; padding: 8px 16px; font-size: 0.9rem;">📦 إدارة المنتجات</a>
      <a href="/admin-offers.html" class="btn-primary" style="text-decoration: none; padding: 8px 16px; font-size: 0.9rem; background: #ffb300; color: #ffffff;">🏷️ إدارة العروض</a>
      <button class="tab-btn active" data-status="pending">⏳ معلقة</button>
      <button class="tab-btn" data-status="approved">✅ موافق عليها</button>
      <button class="tab-btn" data-status="rejected">❌ مرفوضة</button>
    </div>

    <div id="loading" class="loading">⏳ جاري التحميل...</div>
    <div id="emptyState" class="empty-state hidden">
      <div class="emoji">📭</div>
      <p>لا توجد طلبات في هذه القائمة</p>
    </div>
    <div id="ordersContainer"></div>
  </main>

  <script>
    let adminPassword = sessionStorage.getItem('admin_pass') || '';
    let currentStatus = 'pending';

    const $ = (s) => document.querySelector(s);
    const loginView = $('#loginView');
    const adminView = $('#adminView');
    const ordersContainer = $('#ordersContainer');
    const loading = $('#loading');
    const emptyState = $('#emptyState');
    const logoutBtn = $('#logoutBtn');

    $('#loginBtn').onclick = tryLogin;
    $('#passwordInput').onkeypress = (e) => { if (e.key === 'Enter') tryLogin(); };
    logoutBtn.onclick = () => { sessionStorage.removeItem('admin_pass'); location.reload(); };

    async function tryLogin() {
      const pass = $('#passwordInput').value;
      if (!pass) return;
      const errEl = $('#loginError');
      errEl.style.display = 'none';
      try {
        const res = await fetch('/api/admin?status=pending', { headers: { 'X-Admin-Password': pass } });
        if (res.status === 401) { errEl.textContent = 'كلمة المرور غير صحيحة'; errEl.style.display = 'block'; return; }
        adminPassword = pass;
        sessionStorage.setItem('admin_pass', pass);
        showAdmin();
      } catch (e) { errEl.textContent = 'خطأ في الاتصال'; errEl.style.display = 'block'; }
    }

    function showAdmin() {
      loginView.style.display = 'none';
      adminView.style.display = 'block';
      logoutBtn.style.display = 'inline-flex';
      loadOrders();
    }

    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentStatus = btn.dataset.status;
        loadOrders();
      };
    });

    async function loadOrders() {
      loading.style.display = 'block';
      emptyState.classList.add('hidden');
      ordersContainer.innerHTML = '';
      try {
        const res = await fetch(`/api/admin?status=${currentStatus}`, { headers: { 'X-Admin-Password': adminPassword } });
        const data = await res.json();
        if (!data.ok) throw new Error(data.error);
        loading.style.display = 'none';
        if (data.orders.length === 0) { emptyState.classList.remove('hidden'); return; }
        data.orders.forEach(o => ordersContainer.appendChild(renderOrder(o)));
      } catch (e) {
        loading.style.display = 'none';
        ordersContainer.innerHTML = `<p style="color:var(--danger); text-align:center;">❌ ${e.message}</p>`;
      }
    }

    function renderOrder(o) {
      const card = document.createElement('div');
      card.className = 'order-card';
      card.dataset.orderId = o.id;

      const safeDate = o.created_at.includes('Z') ? o.created_at : o.created_at.replace(' ', 'T') + 'Z';
      const date = new Date(safeDate);
      const dateStr = date.toLocaleString('ar-EG', { timeZone: 'Asia/Damascus' });
      const isPending = o.status === 'pending';
      const statusLabels = { pending: 'معلقة', approved: 'موافق عليها', rejected: 'مرفوضة' };

      let itemsHtml = '';
      o.items.forEach(it => {
        const subtotal = Number(it.price) * Number(it.quantity);
        itemsHtml += `
          <div class="order-item-row" data-item-id="${it.id}" data-price="${Number(it.price)}" data-qty="${Number(it.quantity)}">
            <span>${it.product_id ? `<strong>#${it.product_id}</strong> ` : ''}${it.name || 'منتج'}${it.offer_id ? ' (عرض)' : ''}</span>
            <span>$${Number(it.price).toFixed(2)}</span>
            <span class="line-subtotal">$${subtotal.toFixed(2)}</span>
            <span>
              ${isPending 
                ? `<input type="number" class="qty-input" data-pid="${it.product_id || ''}" data-oid="${it.offer_id || ''}" min="1" max="${it.stock || 999}" value="${it.quantity}">`
                : `<strong>${it.quantity}</strong>`
              }
            </span>
            ${isPending ? `<button class="btn-delete-item" title="حذف الصنف">🗑️</button>` : `<span></span>`}
          </div>
        `;
      });

      card.innerHTML = `
        <div class="order-header">
          <div class="order-info">
            <strong>طلب #${o.id}</strong>
            <span>👤 ${o.customer_name} — 📞 ${o.customer_phone}</span>
            ${o.customer_address ? `<span>📍 ${o.customer_address}</span>` : ''}
            ${o.location_lat && o.location_lng ? `<span>🗺️ <a href="https://www.google.com/maps?q=${o.location_lat},${o.location_lng}" target="_blank" style="color: var(--primary); text-decoration: underline;">عرض الموقع على الخريطة</a></span>` : ''}
            <span style="color:var(--text-muted); font-size:0.8rem;">🕒 ${dateStr}</span>
          </div>
          <div style="display:flex; flex-direction:column; align-items:flex-end; gap:6px;">
            <span class="status-badge status-${o.status}">${statusLabels[o.status]}</span>
            <strong id="total-${o.id}" style="color:var(--primary); font-size:1.2rem;">$${Number(o.total).toFixed(2)}</strong>
          </div>
        </div>
        <div class="order-body">${itemsHtml}</div>
        ${isPending ? `
          <div class="order-actions">
            <button class="btn-approve">✅ موافقة (خصم المخزون)</button>
            <button class="btn-reject">❌ رفض</button>
          </div>
        ` : ''}
      `;

      if (isPending) {
        card.querySelector('.btn-approve').onclick = () => approveOrder(o, card);
        card.querySelector('.btn-reject').onclick = () => rejectOrder(o);

        card.querySelectorAll('.btn-delete-item').forEach(btn => {
          btn.onclick = () => {
            if (confirm('حذف هذا الصنف من الطلب؟')) {
              const row = btn.closest('.order-item-row');
              row.remove();
              recalcTotal(card);
            }
          };
        });

        card.querySelectorAll('.qty-input').forEach(inp => {
          inp.addEventListener('input', () => recalcTotal(card));
        });
      }

      return card;
    }

    function recalcTotal(card) {
      let total = 0;
      card.querySelectorAll('.order-item-row').forEach(row => {
        const price = parseFloat(row.dataset.price) || 0;
        const qtyInput = row.querySelector('.qty-input');
        const qty = qtyInput ? (parseInt(qtyInput.value) || 0) : (parseInt(row.dataset.qty) || 0);
        const lineTotal = price * qty;
        const subEl = row.querySelector('.line-subtotal');
        if (subEl) subEl.textContent = '$' + lineTotal.toFixed(2);
        total += lineTotal;
      });
      const totalEl = card.querySelector('[id^="total-"]');
      if (totalEl) totalEl.textContent = '$' + total.toFixed(2);
    }

    async function approveOrder(o, card) {
      const inputs = card.querySelectorAll('.qty-input');
      const items = Array.from(inputs).map(inp => {
        const productId = inp.dataset.pid;
        const offerId = inp.dataset.oid;
        if (offerId && offerId !== 'null' && offerId !== '') {
          return { offer_id: parseInt(offerId), quantity: parseInt(inp.value) };
        } else {
          return { product_id: parseInt(productId), quantity: parseInt(inp.value) };
        }
      });

      const currentItemIds = Array.from(card.querySelectorAll('.order-item-row')).map(r => parseInt(r.dataset.itemId));
      const originalItemIds = o.items.map(it => it.id);
      const deletedIds = originalItemIds.filter(id => !currentItemIds.includes(id));

      if (!confirm(`هل أنت متأكد من الموافقة على الطلب #${o.id}؟\nسيتم خصم الكميات من المخزون.`)) return;

      try {
        const res = await fetch('/api/admin', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-Admin-Password': adminPassword },
          body: JSON.stringify({ action: 'approve', order_id: o.id, items, deleted_item_ids: deletedIds })
        });
        const data = await res.json();
        if (!data.ok) throw new Error(data.error);
        alert('✅ تمت الموافقة بنجاح');
        loadOrders();
      } catch (e) { alert('❌ ' + e.message); }
    }

    async function rejectOrder(o) {
      if (!confirm(`رفض الطلب #${o.id}؟`)) return;
      try {
        const res = await fetch('/api/admin', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-Admin-Password': adminPassword },
          body: JSON.stringify({ action: 'reject', order_id: o.id })
        });
        const data = await res.json();
        if (!data.ok) throw new Error(data.error);
        alert('❌ تم رفض الطلب');
        loadOrders();
      } catch (e) { alert('❌ ' + e.message); }
    }

    if (adminPassword) showAdmin();
  </script>
</body>
</html>
