<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>السلة | متجر السعدني</title>
  <link id="storeFavicon" rel="icon" type="image/png" href="/images/logo.png">
  <link rel="stylesheet" href="/css/style.css">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <style>
    .cart-page { padding: 30px 0 60px; }
    .cart-layout { display: grid; grid-template-columns: 1fr 380px; gap: 24px; }
    @media (max-width: 900px) { .cart-layout { grid-template-columns: 1fr; } }

    .cart-items { display: flex; flex-direction: column; gap: 12px; }
    .cart-item {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 12px;
      box-shadow: var(--shadow);
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .cart-item-img {
      width: 80px; height: 80px; border-radius: var(--radius-sm);
      background: #f9fafb; display: flex; align-items: center; justify-content: center;
      overflow: hidden; flex-shrink: 0;
    }
    .cart-item-img img { width: 100%; height: 100%; object-fit: contain; }
    .cart-item-info { flex: 1; display: flex; flex-direction: column; gap: 6px; }
    .cart-item-name { font-weight: 700; font-size: 0.95rem; }
    .cart-item-price { color: var(--primary); font-weight: 800; font-size: 1rem; }
    .cart-item-controls { display: flex; align-items: center; gap: 6px; }
    .cart-item-remove {
      background: transparent; color: var(--danger);
      font-size: 1.2rem; padding: 4px 8px; border-radius: var(--radius-sm);
    }
    .cart-item-remove:hover { background: #fee2e2; }

    .offer-bundle-card {
      flex-direction: column;
      align-items: stretch;
    }
    .offer-bundle-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }
    .offer-sub-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin: 10px 0;
    }
    .offer-sub-row {
      display: flex;
      gap: 12px;
      align-items: center;
      background: #f9fafb;
      padding: 8px;
      border-radius: var(--radius-sm);
    }
    .offer-badge-note {
      font-size: 0.78rem;
      color: #047857;
      background: #d1fae5;
      padding: 2px 8px;
      border-radius: 999px;
      font-weight: 700;
      display: inline-block;
    }

    .order-summary {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
      height: fit-content;
      position: sticky;
      top: 100px;
    }
    .summary-row { display: flex; justify-content: space-between; margin-bottom: 10px; }
    .summary-row.total {
      border-top: 2px solid var(--border);
      padding-top: 12px;
      margin-top: 12px;
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--primary);
    }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; margin-bottom: 6px; font-weight: 700; font-size: 0.9rem; }
    .form-group input, .form-group textarea {
      width: 100%; padding: 10px; border: 2px solid var(--border);
      border-radius: var(--radius-sm); font-family: inherit; font-size: 0.95rem;
      transition: var(--transition);
    }
    .form-group input:focus, .form-group textarea:focus {
      outline: none; border-color: var(--primary);
    }
    .btn-submit {
      width: 100%; padding: 14px; font-size: 1.05rem;
      background: var(--primary); color: #fff;
      border-radius: var(--radius-sm); font-weight: 800;
      transition: var(--transition);
    }
    .btn-submit:hover { background: var(--primary-dark); }
    .btn-submit:disabled { background: var(--text-muted); cursor: not-allowed; }

    /* تنسيق خريطة تحديد الموقع */
    #mapContainer {
      height: 250px;
      margin-top: 10px;
      border-radius: 8px;
      overflow: hidden;
      display: none;
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header class="site-header">
    <div class="container header-inner">
      <a href="/" class="brand">
        <img src="/images/logo.png" alt="شعار المتجر" class="brand-logo" id="storeLogo">
        <div class="brand-text">
          <span class="ar" id="storeNameAr">متجر السعدني</span>
          <span class="en" id="storeNameEn">Elsaadany Store</span>
        </div>
      </a>
      <div class="header-actions">
        <a href="/" class="icon-btn" style="background: #fff; color: #0040C0; border: none; box-shadow: 0 2px 5px rgba(0,0,0,0.1); font-weight: 700; padding: 8px 16px; border-radius: 999px;">🏠 <span>الرئيسية</span></a>
      </div>
    </div>
  </header>

  <!-- MAIN -->
  <main class="container cart-page">
    <h1 style="color: var(--primary); margin-bottom: 20px; font-size: 1.6rem;">🛒 سلة المشتريات</h1>

    <div id="emptyCart" class="empty-state hidden">
      <div class="emoji">🛒</div>
      <p>السلة فارغة حالياً</p>
      <a href="/" class="btn-primary" style="display:inline-block; margin-top:15px;">تسوق الآن</a>
    </div>

    <div id="cartContent" class="cart-layout hidden">
      <div class="cart-items" id="cartItems"></div>

      <div class="order-summary">
        <h2 style="margin-bottom: 16px; font-size: 1.2rem; color: var(--primary);">تفاصيل الطلب</h2>
        <div class="summary-row">
          <span>عدد المنتجات:</span>
          <strong id="summaryCount">0</strong>
        </div>
        <div class="summary-row total">
          <span>المجموع:</span>
          <span id="summaryTotal"> 0.00</span>
        </div>

        <hr style="margin: 16px 0; border: none; border-top: 1px solid var(--border);">

        <form id="orderForm">
          <div class="form-group">
            <label>الاسم الكامل *</label>
            <input type="text" id="customerName" required minlength="2" placeholder="مثال: أحمد محمد">
          </div>
          <div class="form-group">
            <label>رقم الهاتف *</label>
            <input type="tel" id="customerPhone" required pattern="[0-9+ ]{7,15}" placeholder="9639xxxxxxxx">
          </div>
          <div class="form-group">
            <label>العنوان (اختياري)</label>
            <textarea id="customerAddress" rows="2" placeholder="المدينة، الحي، الشارع"></textarea>
          </div>

          <!-- خريطة تحديد الموقع -->
          <div class="form-group" style="margin-top: 10px;">
            <button type="button" id="toggleMapBtn" class="btn-outline" style="width: 100%; padding: 10px; border-radius: 8px; border: 2px solid var(--primary); color: var(--primary); background: transparent; font-weight: 700; cursor: pointer;">
              📍 تحديد الموقع على الخريطة (اختياري)
            </button>
            <div id="mapContainer"></div>
            <button type="button" id="useMyLocationBtn" class="btn-outline" style="width: 100%; padding: 8px; border-radius: 8px; border: 2px solid var(--primary); color: var(--primary); background: transparent; font-weight: 700; cursor: pointer; margin-top: 8px;">
              📍 استخدام موقعي الحالي
            </button>
            <input type="hidden" id="locationLat" value="">
            <input type="hidden" id="locationLng" value="">
            <p id="locationStatus" style="font-size: 0.8rem; color: var(--text-muted); margin-top: 5px; display: none;"></p>
          </div>

          <button type="submit" class="btn-submit" id="submitBtn">تأكيد الطلب</button>
        </form>
      </div>
    </div>
  </main>

  <script>
    const CART_KEY = 'tsf_cart';
    const loadCart = () => JSON.parse(localStorage.getItem(CART_KEY) || '[]');
    const saveCart = (c) => localStorage.setItem(CART_KEY, JSON.stringify(c));

    const cartItemsEl = document.getElementById('cartItems');
    const emptyCartEl = document.getElementById('emptyCart');
    const cartContentEl = document.getElementById('cartContent');
    const summaryCount = document.getElementById('summaryCount');
    const summaryTotal = document.getElementById('summaryTotal');

    let cachedProductsForOffers = null;
    let storeCurrency = (typeof window.STORE_CURRENCY === 'string')
      ? window.STORE_CURRENCY
      : (localStorage.getItem('store_currency') ?? 'ج.م');

    function formatCurrency(amount) {
      const num = Number(amount || 0).toFixed(2);
      const cur = String(storeCurrency ?? '').trim();
      return cur ? `${num} ${cur}` : num;
    }

    async function getProductsLookupForOffers() {
      if (Array.isArray(cachedProductsForOffers)) {
        return cachedProductsForOffers;
      }
      try {
        const res = await fetch('/api/products');
        const data = await res.json();
        cachedProductsForOffers = (data && data.ok && Array.isArray(data.products))
          ? data.products
          : [];
      } catch (e) {
        cachedProductsForOffers = [];
      }
      return cachedProductsForOffers;
    }

    function normalizeOfferItemName(text) {
      return String(text || '')
        .replace(/\([^)]*\)/g, ' ')
        .replace(/×\s*\d+/g, ' ')
        .replace(/\s+/g, ' ')
        .trim()
        .toLowerCase();
    }

    function findProductByOfferItemText(itemText, productsList) {
      const cleanText = normalizeOfferItemName(itemText);
      if (!cleanText || !Array.isArray(productsList) || productsList.length === 0) {
        return null;
      }

      const exactMatch = productsList.find(p =>
        String(p.name || '').trim().toLowerCase() === cleanText
      );
      if (exactMatch) return exactMatch;

      const partialMatch = productsList.find(p => {
        const pName = String(p.name || '').trim().toLowerCase();
        return pName && (cleanText.includes(pName) || pName.includes(cleanText));
      });
      return partialMatch || null;
    }

    function applyStoreLogo(logoUrl, storeNameAr) {
      const cleanUrl = String(logoUrl || '').trim();
      const logoElement = document.getElementById('storeLogo');
      const faviconElement = document.getElementById('storeFavicon');

      if (!cleanUrl) return;

      if (logoElement) {
        logoElement.src = cleanUrl;
        if (storeNameAr) {
          logoElement.alt = 'شعار ' + storeNameAr;
        }
      }

      if (faviconElement) {
        faviconElement.href = cleanUrl;
      }
    }

    async function loadStoreIdentity() {
      const nameArElement = document.getElementById('storeNameAr');
      const nameEnElement = document.getElementById('storeNameEn');
      const logoElement = document.getElementById('storeLogo');

      try {
        const response = await fetch('/api/settings');
        if (!response.ok) throw new Error('تعذر تحميل إعدادات المتجر');

        const data = await response.json();
        if (!data || data.ok !== true || !data.settings) {
          throw new Error('استجابة إعدادات المتجر غير صالحة');
        }

        const settings = data.settings;
        const storeNameAr = String(settings.store_name_ar || '').trim();
        const storeNameEn = String(settings.store_name_en || '').trim();

        if (storeNameAr && nameArElement) {
          nameArElement.textContent = storeNameAr;
        }

        if (storeNameEn && nameEnElement) {
          nameEnElement.textContent = storeNameEn;
        }

        if (storeNameAr && logoElement) {
          logoElement.alt = 'شعار ' + storeNameAr;
        }

        applyStoreLogo(settings.store_logo_url, storeNameAr);

        const nextCurrency = String(settings.store_currency ?? '').trim();
        storeCurrency = nextCurrency;
        window.STORE_CURRENCY = nextCurrency;
        localStorage.setItem('store_currency', nextCurrency);
        renderCart();
      } catch (error) {
        console.error('تعذر تحميل هوية المتجر:', error);
      }
    }

    function renderCart() {
      const cart = loadCart();
      if (cart.length === 0) {
        emptyCartEl.classList.remove('hidden');
        cartContentEl.classList.add('hidden');
        return;
      }
      emptyCartEl.classList.add('hidden');
      cartContentEl.classList.remove('hidden');

      cartItemsEl.innerHTML = '';
      let total = 0;
      let count = 0;

      cart.forEach((item) => {
        total += item.price * item.quantity;
        count += item.quantity;

        const div = document.createElement('div');
        div.className = 'cart-item';

        const isOffer = item.is_offer || String(item.id).startsWith('offer-');

        if (isOffer) {
          div.classList.add('offer-bundle-card');
          const offerItems = item.items_details
            ? item.items_details.split(' + ').map(d => d.trim()).filter(Boolean)
            : [];

          const productsList = Array.isArray(cachedProductsForOffers) ? cachedProductsForOffers : [];
          const subRowsHtml = offerItems.length > 0
            ? offerItems.map(txt => {
                const matched = findProductByOfferItemText(txt, productsList);
                const imgHtml = matched
                  ? `<img src="/api/image/products/${encodeURIComponent(matched.id)}.webp"
                          alt="${escapeHtml(txt)}"
                          onerror="if(!this.dataset.fb){this.dataset.fb='1';this.src='/images/products/${encodeURIComponent(matched.id)}.webp';}else{this.outerHTML='🛍️';}">`
                  : `<span>🛍️</span>`;

                const regularPriceText = (matched && matched.price !== undefined && matched.price !== null)
                  ? `السعر خارج العرض: ${formatCurrency(matched.price)} • `
                  : '';

                return `
                  <div class="offer-sub-row">
                    <div class="cart-item-img">${imgHtml}</div>
                    <div class="cart-item-info">
                      <div class="cart-item-name">${escapeHtml(txt)}</div>
                      <div><span class="offer-badge-note">داخل العرض (سعر خاص بالعرض)</span></div>
                      <div style="font-size:0.8rem; color:var(--text-muted);">
                        ${regularPriceText}محسوب ضمن باقة العرض
                      </div>
                    </div>
                  </div>
                `;
              }).join('')
            : `<div style="font-size:0.85rem; color:var(--text-muted);">باقة عرض خاص</div>`;

          div.innerHTML = `
            <div class="offer-bundle-header">
              <div class="cart-item-name">
                ${escapeHtml(item.name)}
                <span style="background:#10b981; color:#fff; padding:2px 8px; border-radius:4px; font-size:0.75rem; margin-right:6px;">عرض</span>
              </div>
              <button class="cart-item-remove" title="حذف">✕</button>
            </div>
            <div class="offer-sub-list">
              ${subRowsHtml}
            </div>
            <div class="cart-item-info">
              <div class="cart-item-price">سعر العرض: ${formatCurrency(item.price)}</div>
              <div class="cart-item-controls">
                <button class="qty-btn" data-act="minus">−</button>
                <span style="min-width:30px; text-align:center; font-weight:700;">${item.quantity}</span>
                <button class="qty-btn" data-act="plus">+</button>
                <span style="color:var(--text-muted); font-size:0.8rem; margin-right:auto;">
                  ${item.original_total ? `الأصلي: ${formatCurrency(item.original_total)}` : ''}
                </span>
              </div>
            </div>
          `;
        } else {
          div.innerHTML = `
            <div class="cart-item-img">
              <img src="/api/image/products/${encodeURIComponent(item.id)}.webp"
                   onerror="if(!this.dataset.fb){this.dataset.fb='1';this.src='/images/products/${encodeURIComponent(item.id)}.webp';}else{this.outerHTML='🛍️';}">
            </div>
            <div class="cart-item-info">
              <div class="cart-item-name">${escapeHtml(item.name)}</div>
              <div class="cart-item-price">${formatCurrency(item.price)}</div>
              <div class="cart-item-controls">
                <button class="qty-btn" data-act="minus">−</button>
                <span style="min-width:30px; text-align:center; font-weight:700;">${item.quantity}</span>
                <button class="qty-btn" data-act="plus">+</button>
                <span style="color:var(--text-muted); font-size:0.8rem; margin-right:auto;">
                  (المخزون: ${item.stock || 0})
                </span>
              </div>
            </div>
            <button class="cart-item-remove" title="حذف">✕</button>
          `;
        }

        div.querySelector('[data-act="minus"]').onclick = () => {
          const c = loadCart();
          const it = c.find(i => String(i.id) === String(item.id));
          if (it) { it.quantity = Math.max(1, it.quantity - 1); saveCart(c); renderCart(); }
        };
        div.querySelector('[data-act="plus"]').onclick = () => {
          const c = loadCart();
          const it = c.find(i => String(i.id) === String(item.id));
          if (it) {
            const maxStock = it.stock || 9999;
            it.quantity = Math.min(maxStock, it.quantity + 1);
            saveCart(c); renderCart();
          }
        };
        div.querySelector('.cart-item-remove').onclick = () => {
          const c = loadCart().filter(i => String(i.id) !== String(item.id));
          saveCart(c);
          renderCart();
        };

        cartItemsEl.appendChild(div);
      });

      summaryCount.textContent = count;
      summaryTotal.textContent = formatCurrency(total);
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
      }[c]));
    }

    // ============================================================
    // إرسال الطلب (مع الإحداثيات)
    // ============================================================
    document.getElementById('orderForm').onsubmit = async (e) => {
      e.preventDefault();
      const submitBtn = document.getElementById('submitBtn');
      const cart = loadCart();

      if (cart.length === 0) {
        alert('السلة فارغة');
        return;
      }

      const name = document.getElementById('customerName').value.trim();
      const phone = document.getElementById('customerPhone').value.trim();
      const address = document.getElementById('customerAddress').value.trim();
      const lat = document.getElementById('locationLat').value;
      const lng = document.getElementById('locationLng').value;

      if (!name || !phone) {
        alert('يرجى إدخال الاسم ورقم الهاتف');
        return;
      }

      const total = cart.reduce((s, i) => s + i.price * i.quantity, 0);

      const payload = {
        customer_name: name,
        customer_phone: phone,
        customer_address: address,
        location_lat: lat || null,
        location_lng: lng || null,
        total: total,
        items: cart.map(i => {
          if (i.is_offer) {
            return {
              product_id: null,
              offer_id: parseInt(String(i.id).replace('offer-', '')),
              quantity: i.quantity,
              price: i.price,
              item_name: i.name
            };
          } else {
            return { product_id: i.id, quantity: i.quantity, price: i.price };
          }
        })
      };

      submitBtn.disabled = true;
      submitBtn.textContent = 'جاري الإرسال...';

      try {
        const res = await fetch('/api/orders', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();

        if (!data.ok) throw new Error(data.error || 'فشل الطلب');

        // --- تجهيز رسالة الواتساب ---
        let managerPhone = '201000001559';

        try {
          const settingsRes = await fetch('/api/settings');
          const settingsData = await settingsRes.json();

          const configuredPhone =
            settingsData.settings?.orders_whatsapp_number || '';

          if (settingsData.ok && configuredPhone) {
            managerPhone = configuredPhone.replace(/\D/g, '');
          }
        } catch (settingsError) {
          console.warn(
            'تعذر تحميل رقم استقبال الطلبات، سيتم استخدام الرقم الافتراضي.',
            settingsError
          );
        }

        let waMessage = ` *فاتورة طلب جديدة* \n`;
        waMessage += `--------------------\n`;
        waMessage += ` *الاسم:* ${name}\n`;
        waMessage += ` *الهاتف:* ${phone}\n`;
        if (address) waMessage += ` *العنوان:* ${address}\n`;
        if (lat && lng) waMessage += ` *الموقع:* https://www.google.com/maps?q=${lat},${lng}\n`;
        waMessage += `--------------------\n`;
        waMessage += ` *المنتجات:*\n`;

        cart.forEach((item, index) => {
          const itemTotal = formatCurrency(item.price * item.quantity);
          waMessage += ` ${index + 1}. ${item.name} (الكمية: ${item.quantity}) = ${itemTotal}\n`;
        });

        waMessage += `--------------------\n`;
        waMessage += ` *الإجمالي:* ${formatCurrency(total)}\n`;
        waMessage += ` *رابط الفاتورة:* ${location.origin}/invoice.html?id=${data.order_id}\n`;
        waMessage += ` *رقم الطلب:* #${data.order_id}`;

        const encodedMessage = encodeURIComponent(waMessage);
        const waUrl = `https://wa.me/${managerPhone}?text=${encodedMessage}`;

        localStorage.removeItem(CART_KEY);

        alert(`✅ تم حفظ طلبك بنجاح!\nسيتم الآن تحويلك لواتساب لتأكيد الطلب وإرسال الفاتورة للمدير.`);

        window.open(waUrl, '_blank');
        window.location.href = '/';
      } catch (err) {
        alert('❌ حدث خطأ: ' + err.message);
        submitBtn.disabled = false;
        submitBtn.textContent = 'تأكيد الطلب';
      }
    };

    // ============================================================
    // خريطة تحديد الموقع (Leaflet) - في وسم منفصل
    // ============================================================
    let map = null;
    let marker = null;

    function initMap() {
      const mapContainer = document.getElementById('mapContainer');
      if (!mapContainer) return;
      if (map) return;

      map = L.map('mapContainer').setView([33.5138, 36.2765], 12);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
      }).addTo(map);

      marker = L.marker([33.5138, 36.2765], { draggable: true }).addTo(map);

      marker.on('dragend', function() {
        const latlng = marker.getLatLng();
        updateLocation(latlng.lat, latlng.lng);
      });

      map.on('click', function(e) {
        marker.setLatLng(e.latlng);
        updateLocation(e.latlng.lat, e.latlng.lng);
      });

      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (position) => {
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            map.setView([lat, lng], 15);
            marker.setLatLng([lat, lng]);
            updateLocation(lat, lng);
          },
          () => {}
        );
      }
    }

    function updateLocation(lat, lng) {
      document.getElementById('locationLat').value = lat;
      document.getElementById('locationLng').value = lng;
      const status = document.getElementById('locationStatus');
      if (status) {
        status.style.display = 'block';
        status.textContent = `✅ تم تحديد الموقع: ${lat.toFixed(5)}, ${lng.toFixed(5)}`;
      }
    }

    document.getElementById('useMyLocationBtn').addEventListener('click', () => {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (position) => {
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            updateLocation(lat, lng);
            if (map && marker) {
              map.setView([lat, lng], 15);
              marker.setLatLng([lat, lng]);
              updateLocation(lat, lng);
            }
          },
          () => {
            alert('❌ لم نتمكن من جلب موقعك. يرجى التأكد من السماح بالوصول إلى الموقع.');
          }
        );
      } else {
        alert('❌ متصفحك لا يدعم تحديد الموقع.');
      }
    });

    document.addEventListener('DOMContentLoaded', () => {
      const toggleBtn = document.getElementById('toggleMapBtn');
      const mapContainer = document.getElementById('mapContainer');
      if (toggleBtn && mapContainer) {
        toggleBtn.addEventListener('click', () => {
          if (mapContainer.style.display === 'none' || mapContainer.style.display === '') {
            mapContainer.style.display = 'block';
            toggleBtn.textContent = '❌ إخفاء الخريطة';
            initMap();
            setTimeout(() => { if (map) map.invalidateSize(); }, 100);
          } else {
            mapContainer.style.display = 'none';
            toggleBtn.textContent = '📍 تحديد الموقع على الخريطة (اختياري)';
          }
        });
      }
    });

    loadStoreIdentity();
    (async () => {
      await getProductsLookupForOffers();
      renderCart();
    })();
  </script>

  <script src="/js/brand-palette.js"></script>
</body>
</html>
