  <!-- ============ FLOATING WHATSAPP ============ -->

    <span class="wa-tooltip">الانضمام لمجتمع الشركة</span>
  </a>

  <script>
    const API_BASE = '/api';
    const CART_KEY = 'tsf_cart';

    // إدارة السلة (نسخة مبسطة)
    function loadCart() { return JSON.parse(localStorage.getItem(CART_KEY) || '[]'); }
    function saveCart(cart) { localStorage.setItem(CART_KEY, JSON.stringify(cart)); updateCartBadge(); }
    function updateCartBadge() {
      const total = loadCart().reduce((s, i) => s + i.quantity, 0);
      document.getElementById('cartBadge').textContent = total;
      document.getElementById('cartBadge').style.display = total > 0 ? 'inline-flex' : 'none';
    }
    function addToCart(product, quantity) {
      const cart = loadCart();
      const productId = Number(product.id);
      const existing = cart.find(i => Number(i.id) === productId);
      if (existing) {
        existing.quantity = Math.min(existing.quantity + quantity, product.stock);
      } else {
        cart.push({ id: productId, name: product.name, price: Number(product.price), stock: Number(product.stock), quantity });
      }
      saveCart(cart);
      alert(`✅ تمت إضافة ${quantity} × ${product.name} للسلة`);
    }

    // جلب المنتجات الجديدة
    async function loadNewProducts() {
      try {
        // جلب كل المنتجات
        const res = await fetch(`${API_BASE}/products`);
        const data = await res.json();
        if (!data.ok) throw new Error(data.error);

        // تصفية المنتجات التي أضيفت خلال آخر 7 أيام
        // نقوم بحساب الفرق بالأيام مباشرة
        const now = new Date().getTime();
        const sevenDaysInMs = 7 * 24 * 60 * 60 * 1000;

        const newProducts = (data.products || []).filter(p => {
          if (!p.created_at) return false;
          
          // تحويل التاريخ إلى كائن Date (مع مراعاة توقيت UTC)
          let createdDate;
          try {
            // إضافة 'Z' إذا لم تكن موجودة لضمان قراءة التوقيت كـ UTC
            const dateStr = p.created_at.includes('Z') || p.created_at.includes('+') 
              ? p.created_at 
              : p.created_at + 'Z';
            createdDate = new Date(dateStr).getTime();
          } catch (e) {
            return false;
          }
          
          // حساب الفرق
          const diff = now - createdDate;
          
          // إذا كان الفرق أقل من 7 أيام (أو كان التاريخ في المستقبل بسبب اختلاف التوقيت)
          return diff >= 0 && diff <= sevenDaysInMs;
        });

        // عرض المنتجات
        const grid = document.getElementById('productsGrid');
        const loading = document.getElementById('loading');
        const empty = document.getElementById('emptyState');
        
        loading.classList.add('hidden');

        if (newProducts.length === 0) {
          empty.classList.remove('hidden');
          return;
        }

        newProducts.forEach(p => {
          const card = document.createElement('div');
          card.className = 'product-card';
          card.innerHTML = `
            <span class="new-badge">جديد</span>
            <span class="product-id-badge">#${p.id}</span>
            <div class="product-img-wrap">
              <img src="/images/products/${p.id}.png" alt="${p.name}" onerror="this.outerHTML='<div class=&quot;product-placeholder&quot;>🛍️</div>'">
            </div>
            <div class="product-info">
              <div class="product-name">${p.name}</div>
              <div class="product-meta">
                <span class="product-price">$${Number(p.price).toFixed(2)}</span>
                <span class="product-stock">مخزون: ${p.stock}</span>
              </div>
              <div class="card-actions" style="margin-top: 8px;">
                <button class="btn-add-cart" onclick="addToCart({id: ${p.id}, name: '${p.name}', price: ${p.price}, stock: ${p.stock}}, 1)">🛒 أضف للسلة</button>
              </div>
            </div>
          `;
          grid.appendChild(card);
        });

      } catch (err) {
        document.getElementById('loading').textContent = '❌ حدث خطأ: ' + err.message;
      }
    }

    updateCartBadge();
    loadNewProducts();
  </script>
