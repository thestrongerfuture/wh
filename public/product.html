<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تفاصيل المنتج | شركة المستقبل الأقوى</title>
  <link rel="icon" type="image/png" href="/images/logo.png">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .product-page { padding: 40px 0; display: flex; justify-content: center; }
    .product-details-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      display: flex;
      max-width: 900px;
      width: 100%;
      overflow: hidden;
      flex-wrap: wrap;
    }
    .product-details-img {
      flex: 1;
      min-width: 300px;
      background: #f9fafb;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px;
    }
    .product-details-img img {
      max-width: 100%;
      max-height: 500px;
      object-fit: contain;
      border-radius: var(--radius-sm);
    }
    .product-details-info {
      flex: 1;
      min-width: 300px;
      padding: 40px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .product-details-info h1 {
      color: var(--primary);
      font-size: 1.8rem;
      line-height: 1.3;
    }
    .meta-row {
      display: flex;
      gap: 15px;
      color: var(--text-muted);
      font-size: 0.9rem;
    }
    .badge {
      background: #e0e7ff;
      color: var(--primary);
      padding: 4px 12px;
      border-radius: 999px;
      font-weight: 700;
    }
    .price-large {
      font-size: 2rem;
      font-weight: 800;
      color: var(--primary);
    }
    .back-btn {
      display: inline-block;
      margin-bottom: 20px;
      color: var(--primary);
      font-weight: 700;
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header class="site-header">
    <div class="container header-inner">
      <a href="/" class="brand">
        <img src="/images/logo.png" alt="شعار" class="brand-logo">
        <div class="brand-text">
          <span class="ar">شركة المستقبل الأقوى</span>
          <span class="en">The Stronger Future</span>
        </div>
      </a>
      <div class="header-actions">
        <a href="/cart.html" class="cart-btn">
          🛒 <span>السلة</span>
          <span class="cart-badge" id="cartBadge">0</span>
        </a>
      </div>
    </div>
  </header>

  <!-- MAIN -->
  <main class="container product-page">
    <div style="width: 100%;">
      <a href="/" class="back-btn">← العودة للمتجر</a>
      
      <div id="loading" class="loading">⏳ جاري تحميل المنتج...</div>
      <div id="errorMsg" class="empty-state hidden">
        <div class="emoji">❌</div>
        <p>عذراً، لم يتم العثور على هذا المنتج.</p>
      </div>

      <div id="productContainer" class="product-details-card hidden">
        <div class="product-details-img">
          <img id="prodImg" src="" alt="">
        </div>
        <div class="product-details-info">
          <div class="meta-row">
            <span class="badge" id="prodBrand"></span>
            <span class="badge" id="prodCategory" style="background:#f3f4f6; color:#333;"></span>
          </div>
          <h1 id="prodName"></h1>
          <div class="price-large" id="prodPrice"></div>
          
          <div style="color:var(--text-muted);">
            رقم المنتج: <strong id="prodId"></strong>
          </div>

          <div style="margin-top: 20px; border-top:1px solid var(--border); padding-top:20px;">
            <p style="margin-bottom: 10px; font-weight:700;">الكمية:</p>
            <div class="qty-control" style="max-width: 200px;">
              <button class="qty-btn" id="btnMinus">−</button>
              <input type="range" class="qty-slider" id="qtySlider" min="1" value="1">
              <span class="qty-value" id="qtyVal">1</span>
              <button class="qty-btn" id="btnPlus">+</button>
            </div>
          </div>

          <div style="display:flex; gap:10px; margin-top:20px;">
            <button class="btn-primary" id="addToCartBtn" style="flex:1; padding:15px; font-size:1.1rem;">🛒 أضف للسلة</button>
            <button class="btn-outline" id="shareBtn" style="padding:15px;">🔗</button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script>
    // إدارة السلة
    const CART_KEY = 'tsf_cart';
    const loadCart = () => JSON.parse(localStorage.getItem(CART_KEY) || '[]');
    const saveCart = (c) => { localStorage.setItem(CART_KEY, JSON.stringify(c)); updateBadge(); };
    const updateBadge = () => {
      const total = loadCart().reduce((s, i) => s + i.quantity, 0);
      document.getElementById('cartBadge').textContent = total;
      document.getElementById('cartBadge').style.display = total > 0 ? 'inline-block' : 'none';
    };

    let currentProduct = null;

    // جلب المنتج من الرابط
    const urlParams = new URLSearchParams(window.location.search);
    const productId = urlParams.get('id');

    async function loadProduct() {
      if (!productId) return showError();
      try {
        const res = await fetch(`/api/products?id=${productId}`);
        const data = await res.json();
        if (!data.ok || !data.product) return showError();
        
        currentProduct = data.product;
        renderProduct();
      } catch (e) {
        showError();
      }
    }

    function renderProduct() {
      document.getElementById('loading').classList.add('hidden');
      document.getElementById('productContainer').classList.remove('hidden');

      const p = currentProduct;
      document.getElementById('prodName').textContent = p.name;
      document.getElementById('prodBrand').textContent = p.brand;
      document.getElementById('prodCategory').textContent = p.category;
      document.getElementById('prodPrice').textContent = `$${p.price.toFixed(2)}`;
      document.getElementById('prodId').textContent = `#${p.id}`;
      
      const img = document.getElementById('prodImg');
      img.src = `/images/products/${p.id}.png`;
      img.onerror = () => { img.src = '/images/logo.png'; }; // صورة بديلة

      // إعداد شريط الكمية
      const slider = document.getElementById('qtySlider');
      slider.max = p.stock;
      if (p.stock <= 0) {
        slider.disabled = true;
        document.getElementById('btnMinus').disabled = true;
        document.getElementById('btnPlus').disabled = true;
        document.getElementById('addToCartBtn').disabled = true;
        document.getElementById('addToCartBtn').textContent = 'نفد المخزون';
      }

      // ربط الأحداث
      const setQ = (v) => {
        v = Math.max(1, Math.min(p.stock, v));
        slider.value = v;
        document.getElementById('qtyVal').textContent = v;
      };
      slider.oninput = () => setQ(+slider.value);
      document.getElementById('btnMinus').onclick = () => setQ(+slider.value - 1);
      document.getElementById('btnPlus').onclick = () => setQ(+slider.value + 1);

      document.getElementById('addToCartBtn').onclick = () => {
        const q = +slider.value;
        const cart = loadCart();
        const existing = cart.find(i => i.id === p.id);
        if (existing) existing.quantity = Math.min(existing.quantity + q, p.stock);
        else cart.push({ ...p, quantity: q });
        
        saveCart(cart);
        alert('✅ تمت الإضافة للسلة');
      };

      document.getElementById('shareBtn').onclick = async () => {
        try {
          if (navigator.share) await navigator.share({ title: p.name, url: window.location.href });
          else { await navigator.clipboard.writeText(window.location.href); alert('📋 تم نسخ الرابط'); }
        } catch (e) {}
      };
    }

    function showError() {
      document.getElementById('loading').classList.add('hidden');
      document.getElementById('errorMsg').classList.remove('hidden');
    }

    updateBadge();
    loadProduct();
  </script>
</body>
</html>
